anchor:
  key: mam
  name: mammography
  pred: mammography
  desc: mammography procedure
  codes_text: The list holds every mammography procedure code, screening or diagnostic. The main codes are screening mammography (77067) and diagnostic mammography (77065 and 77066).
  has: a mammography event
window_days: 1
min_entities: 3
abbreviations:
  CPT4: Current Procedural Terminology, fourth edition
  SNOMED: Systematized Nomenclature of Medicine
  DCIS: ductal carcinoma in situ
  LCIS: lobular carcinoma in situ
  CBC: complete blood count
  FSH: follicle stimulating hormone
  HbA1c: hemoglobin A1c
  STI: sexually transmitted infection
  DNA: deoxyribonucleic acid
  RNA: ribonucleic acid
  HPV: human papillomavirus
  ECG: electrocardiogram
  T4: thyroxine
extra_overview:
- RxNorm is the drug code system of the National Library of Medicine.
- The cohort has female patients with at least one mammography procedure. The data method does not use a breast cancer diagnosis to group the patients.
- Ductal carcinoma in situ (DCIS) and lobular carcinoma in situ (LCIS) are early breast changes inside the milk ducts or lobules. They are not invasive cancer. Patients with only DCIS or LCIS stay in the cohort. Care pattern c6 holds most of the codes for these changes. Care pattern c7 holds part of them.
- In care pattern c0, screening mammography is itself a mammography event, so it is always in the window. Breast tomosynthesis has a median of 0 days against the first mammography.
sequence_rule: A sequence is a list of events in a fixed order. Other events between the steps do not break the sequence. A sequence has no time limit between its steps. The data method found the sequences in the full history of the patient, with or without a mammography step. A step is true for any code of its list.
sequence_rates_note: The shares count the steps in this order at any time. They have no time limit between the steps. The other care patterns are a random sample of 1,500 patients. The re-test splits the patients of a care pattern into 2 random halves, 5 times. It finds the sequence on one half and checks it on the other half. The column shows in how many of the 5 re-tests the sequence held.
sequence_check_name: re-test
references:
- US Preventive Services Task Force. *Screening for Breast Cancer, Recommendation Statement.* JAMA 2024;331(22):1918-1930. doi:10.1001/jama.2024.5534.
- Nahleh Z, et al. *Breast Cancer Follow-Up and Surveillance After Primary Treatment, ASCO Guideline Update.* J Clin Oncol 2026. doi:10.1200/JCO-26-01700.
