# Config of the one-file colonoscopy page. Build: python <skill>/scripts/build_page.py colonoscopy_page.yaml
# Format: .claude/skills/bundle-predicate-page/references/config_format.md. Paths are relative to this file.
# Style rule: write the full term first and the abbreviation after it, in brackets. List every abbreviation in `abbreviations`.
title: 'Colonoscopy Predicates and Composites: All Care Patterns'
status_line: Working Draft — October 2026
cohort_n: 211291
run_text: the k=7 run of the data method (`nmf_k7_colonoscopy_v1`)
files:
  final_table: outputs/final_table_colonoscopy_k7_v1.xlsx
  members: outputs/token_members_k7_colonoscopy_v1.csv
output: outputs/colonoscopy_all_patterns.md
anchor:
  key: col
  name: colonoscopy
  pred: colonoscopy
  desc: colonoscopy procedure
  codes_text: The list holds every colonoscopy procedure code. The main codes are diagnostic colonoscopy (CPT4 45378), colonoscopy with biopsy (CPT4 45380), and colonoscopy with polyp removal (CPT4 45385).
  has: a colonoscopy event
window_days: 1
min_entities: 3
abbreviations:
  CPT4: Current Procedural Terminology, fourth edition
  SNOMED: Systematized Nomenclature of Medicine
  ECG: electrocardiogram
  CBC: complete blood count
  PSA: prostate specific antigen
  PPI: proton pump inhibitor
  H2: histamine-2
  HPV: human papillomavirus
  HbA1c: hemoglobin A1c
  T4: thyroxine
extra_overview:
- RxNorm is the drug code system of the National Library of Medicine.
- The cohort has patients of both sexes with at least one colonoscopy procedure. The data method does not use a colorectal cancer diagnosis to group the patients.
- In care pattern c5, colonoscopy with polyp removal is itself a colonoscopy event, so it is always in the window. The other 4 entities of c5 have a median of 0 days against the first colonoscopy.
sequence_rule: A sequence is a list of events in a fixed order. Other events between the steps do not break the sequence. A sequence has no time limit between its steps. The data method found the sequences in the full history of the patient, with or without a colonoscopy step. A step is true for any code of its list.
sequence_rates_note: The shares count the steps in this order at any time. They have no time limit between the steps. The other care patterns are a random sample of 1,500 patients. The re-test splits the patients of a care pattern into 2 random halves, 5 times. It finds the sequence on one half and checks it on the other half. The column shows in how many of the 5 re-tests the sequence held.
sequence_check_name: re-test
references:
- US Preventive Services Task Force. *Screening for Colorectal Cancer, Recommendation Statement.* JAMA 2021;325(19):1965-1977. doi:10.1001/jama.2021.6238.
- Gupta S, et al. *Recommendations for Follow-Up After Colonoscopy and Polypectomy, A Consensus Update by the US Multi-Society Task Force on Colorectal Cancer.* Gastroenterology 2020;158:1131-1153. doi:10.1053/j.gastro.2019.10.026.
families:
  Diagnoses: [abdpain, polyp, benign, diverticular]
  Lab tests: [lipid, venip, trop, chem, cbc, psa, b12, vitd, t4, iron, testosterone, hba1c, cervical, surgpath]
  Procedures, imaging, and visits: [genexam, periodic, gyn, immun, ecg, ecg93005, crcvisit, bcscreen, bcvisit, polypectomy, biopsy, therproc, ther97110, manual, theract, pteval]
  Drugs: [methylpred, amoxclav, azithro, pred, ppi, ondansetron]
entities:
  abdpain:
    name: Abdominal pain
    noun: abdominal pain diagnosis
    sents:
    - Abdominal pain is a diagnosis of pain in the belly.
    - The list holds 6 codes, for example epigastric pain, lower abdominal pain, and swelling of the belly from gas.
    pred: abdominal_pain
    desc: abdominal pain diagnosis (any of 6 codes)
    token: abdominal_pain
  polyp:
    name: Colorectal polyp
    noun: colorectal polyp diagnosis
    sents:
    - A colorectal polyp is a growth on the wall of the colon or the rectum.
    - The list holds 2 diagnosis codes, one for the colon and one for the rectum.
    pred: colorectal_polyp
    desc: colorectal polyp diagnosis (colon OR rectum)
    token: colorectal_polyp
  benign:
    name: Benign colorectal neoplasm
    noun: benign colorectal neoplasm diagnosis
    sents:
    - A benign colorectal neoplasm is a growth of the colon or the rectum that is not cancer.
    - The list holds 11 diagnosis codes for the colon, the rectum, the appendix, and the anus.
    pred: benign_colorectal_neoplasm
    desc: benign colorectal neoplasm diagnosis (any of 11 codes)
    token: benign_colorectal_neoplasm
  diverticular:
    name: Diverticular disease
    noun: diverticular disease diagnosis
    sents:
    - Diverticular disease is a condition with small pouches in the wall of a hollow organ.
    - The list holds 24 diagnosis codes, with and without inflammation of the pouches. Most are for the large intestine.
    pred: diverticular_disease
    desc: diverticular disease diagnosis (any of 24 codes)
    token: diverticular_disease
  lipid:
    name: Lipid panel
    noun: lipid panel
    sents:
    - A lipid panel is a blood test for cholesterol and other fats.
    - Doctors order it at check-ups, so it alone does not show the type of care.
    pred: lipid_panel
    desc: lipid panel
    vocab: CPT4
    code: '80061'
  venip:
    name: Venipuncture
    noun: venipuncture
    sents:
