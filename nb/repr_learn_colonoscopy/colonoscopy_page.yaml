care_patterns:
  c0:
    prefix: acute
    name: acute care work-up, bowel complications, and colorectal cancer treatment
    services: [[ecg, [0, 1]], [abdpain, [2]], [trop, [3]], [ondansetron, [4]]]
    pats: [[ecg93005, chem, x2], [ecg93005, chem, cbc], [ecg93005, venip, chem]]
  c1:
    prefix: checkup
    name: preventive check-up and screening labs
    services: [[genexam, [0]], [lipid, [1]], [periodic, [2]], [venip, [3]], [immun, [4]]]
    pats: [[genexam, lipid, psa], [venip, lipid, psa], [genexam, lipid, crcvisit]]
  c2:
    prefix: rx
    name: prescriptions for acute illness and bowel preparation
    services: [[methylpred, [0]], [amoxclav, [1]], [azithro, [2]], [ppi, [3]], [pred, [4]]]
    pats: [[ppi, x2, azithro], [amoxclav, ppi, x2], [ppi, x2, amoxclav]]
  c3:
    prefix: womens
    name: women's preventive care
    services: [[bcscreen, [0]], [gyn, [1]], [cervical, [2]], [periodic, [3]], [bcvisit, [4]]]
    pats: [[cervical, periodic, bcscreen], [bcscreen, periodic, gyn], [periodic, x2, gyn]]
  c4:
    prefix: pt
    name: physical therapy and muscle and bone pain
    services: [[therproc, [0, 3]], [manual, [1]], [theract, [2]], [pteval, [4]]]
    pats: [[manual, ther97110, x2, theract], [manual, ther97110, theract], [ther97110, manual, x2, theract]]
  c5:
    prefix: procedure
    name: colonoscopy procedure episode
    services: [[polypectomy, [0]], [polyp, [1]], [surgpath, [2]], [benign, [3]], [crcvisit, [4]]]
    pats: [[diverticular, polyp, polypectomy], [polyp, biopsy, polypectomy], [diverticular, polyp, polypectomy, crcvisit]]
  c6:
    prefix: labs
    name: endocrine, nutrient, and iron blood tests
    services: [[vitd, [0]], [b12, [1]], [t4, [2]], [iron, [3]], [testosterone, [4]]]
    pats: [[lipid, vitd, t4], [vitd, hba1c, t4], [lipid, vitd, b12, hba1c]]
